<title>Five Hundred Cookies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=IBM+Plex+Mono:wght@400;600&display=swap">

<style>
  :root {
    --tin:   #1A1410;
    --cocoa: #241A12;
    --brass: #E8B24A;
    --cream: #F2E6CE;
    --dough: #D8A45C;
    --sea:   #1E5F87;
    --faint: #8A7458;
  }

  html, body { height: 100%; }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 20px;
    color: var(--cream);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    background:
      radial-gradient(130% 90% at 50% -20%, #3A2A1C 0%, transparent 62%),
      var(--tin);
  }

  /* 960x600 is 1.6:1 — cap the width by the leftover viewport height
     so the frame never letterboxes and never overflows */
  .wrap {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: min(960px, 100%, calc((100vh - 200px) * 1.6));
  }

  .head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 18px;
    flex-wrap: wrap;
  }

  h1 {
    font-family: "Alfa Slab One", Georgia, serif;
    font-size: clamp(20px, 3.6vw, 34px);
    letter-spacing: 0.01em;
    line-height: 1;
    color: var(--cream);
    text-wrap: balance;
  }

  h1 span { color: var(--dough); }

  .tag {
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--faint);
  }

  .screen {
    position: relative;
    border: 3px solid var(--brass);
    border-radius: 3px;
    box-shadow: 0 0 0 7px var(--cocoa), 0 24px 64px rgba(0, 0, 0, 0.65);
    overflow: hidden;
    line-height: 0;
  }

  canvas {
    display: block;
    width: 100%;
    height: auto;
    background: var(--tin);
    touch-action: none;
  }

  .keys {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 24px;
    font-size: 13px;
    color: var(--faint);
  }

  kbd {
    font: 600 12px "IBM Plex Mono", monospace;
    color: var(--cream);
    background: #2E2118;
    border: 1px solid #4A3726;
    border-bottom-width: 2px;
    border-radius: 3px;
    padding: 1px 6px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .screen::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.03) 0 1px,
        transparent 1px 3px);
    }
  }
</style>

<div class="wrap">
  <div class="head">
    <h1>Five Hundred <span>Cookies</span></h1>
    <span class="tag">then the ship turns up</span>
  </div>

  <div class="screen">
    <canvas id="game" width="960" height="600" aria-label="Cookie eating game"></canvas>
  </div>

  <div class="keys">
    <span><kbd>A</kbd><kbd>D</kbd> / arrows / <kbd>W</kbd> — walk</span>
    <span><kbd>E</kbd> — eat (hold it)</span>
    <span><kbd>B</kbd> — go aboard</span>
    <span><kbd>R</kbd> — restart</span>
    <span><kbd>0</kbd> — skip to the ship</span>
  </div>
</div>

<script>
(() => {
  "use strict";

  const W = 960, H = 600, GROUND = 430;
  const GOAL = 500;

  const cv = document.getElementById("game");
  const ctx = cv.getContext("2d");
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.scale(dpr, dpr);

  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const lerp = (a, b, k) => a + (b - a) * k;
  const comma = n => n.toLocaleString("en-US");

  /* ── sound, all of it generated ─────────────────────────── */
  let AC = null;
  const ac = () => AC || (AC = new (window.AudioContext || window.webkitAudioContext)());
  function tone(f, d, type = "sine", vol = 0.1, delay = 0, f2) {
    try {
      const a = ac(), o = a.createOscillator(), g = a.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f, a.currentTime + delay);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, a.currentTime + delay + d);
      g.gain.setValueAtTime(vol, a.currentTime + delay);
      g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + delay + d);
      o.connect(g); g.connect(a.destination);
      o.start(a.currentTime + delay); o.stop(a.currentTime + delay + d + 0.02);
    } catch (e) {}
  }
  function noise(d, vol = 0.1, delay = 0, cut = 1200) {
    try {
      const a = ac(), n = Math.floor(a.sampleRate * d);
      const buf = a.createBuffer(1, n, a.sampleRate), ch = buf.getChannelData(0);
      for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const s = a.createBufferSource(); s.buffer = buf;
      const f = a.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = cut;
      const g = a.createGain(); g.gain.value = vol;
      s.connect(f); f.connect(g); g.connect(a.destination);
      s.start(a.currentTime + delay);
    } catch (e) {}
  }
  const SFX = {
    chomp: () => { noise(0.07, 0.12, 0, 900); tone(rnd(150, 200), 0.07, "square", 0.07, 0, 80); },
    land:  () => tone(rnd(210, 300), 0.05, "triangle", 0.04),
    horn:  () => [196, 262, 330].forEach((f, i) => tone(f, 0.8, "sawtooth", 0.09, i * 0.13)),
    boom:  () => { noise(0.7, 0.24); tone(88, 0.55, "triangle", 0.17, 0, 30); },
    rise:  () => { tone(60, 1.5, "sawtooth", 0.12, 0, 190); noise(1.2, 0.08, 0, 260); },
    yay:   () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.5, "triangle", 0.1, i * 0.09)),
    row:   () => noise(0.2, 0.06, 0, 500)
  };

  /* ── input ──────────────────────────────────────────────── */
  const keys = new Set();
  addEventListener("keydown", e => {
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if ([" ", "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(e.key)) e.preventDefault();
    keys.add(k);
    if (k === "r") reset();
    if (k === "b" && !e.repeat) tryBoard();
    /* skip the eating and call the ship in */
    if (k === "0" && G.state === "rain" && G.n < GOAL) {
      G.n = GOAL; G.cookies = []; SFX.yay(); SFX.horn(); G.shake = 1.4;
      pop(W / 2, 240, "FIVE HUNDRED", "#E8B24A", 46);
    }
    try { ac().resume(); } catch (err) {}
  });
  addEventListener("keyup", e => keys.delete(e.key.length === 1 ? e.key.toLowerCase() : e.key));
  addEventListener("blur", () => keys.clear());
  const held = (...k) => k.some(n => keys.has(n));

  /* ── state ──────────────────────────────────────────────── */
  let G;

  function reset() {
    G = {
      state: "rain",      // rain → deck → shudder → sink → boat → loop → end
      t: 0, phase: 0, shake: 0,
      px: 300, face: 1, walkT: 0,
      n: 0, eat: 0, cookies: [], crumbs: [], pops: [],
      ship: 0,            // 0..1, the Titanic coming in
      tilt: 0, water: 0, boat: 0, loopT: 0
    };
    for (let i = 0; i < 22; i++) {
      const c = newCookie();
      c.y = GROUND - c.r; c.landed = true;
      G.cookies.push(c);
    }
  }

  function newCookie() {
    return {
      x: rnd(60, 900), y: -rnd(20, 340), vy: rnd(1.2, 2.8),
      r: rnd(11, 17), spin: rnd(0, 6.3), vs: rnd(-0.07, 0.07), landed: false,
      chips: Array.from({ length: 5 }, () => [rnd(-0.55, 0.55), rnd(-0.55, 0.55), rnd(1.6, 3)])
    };
  }

  function pop(x, y, text, color = "#FFE45A", size = 22) {
    G.pops.push({ x, y, text, color, size, life: 0.8 });
  }

  function crumb(x, y, color, n = 7) {
    for (let i = 0; i < n; i++)
      G.crumbs.push({ x, y, vx: rnd(-2.6, 2.6), vy: rnd(-3.4, -0.4),
                      c: color, life: rnd(0.25, 0.55), r: rnd(2, 4) });
  }

  function tryBoard() {
    if (G.state !== "rain") return;
    if (G.n < GOAL) { pop(G.px, GROUND - 110, "EAT " + comma(GOAL - G.n) + " MORE", "#F2E6CE", 18); return; }
    if (G.ship < 1) { pop(G.px, GROUND - 110, "IT IS STILL COMING IN", "#F2E6CE", 18); return; }
    G.state = "deck"; G.t = 0; G.px = 470;
    G.shake = 1; SFX.horn();
  }

  /* ── update ─────────────────────────────────────────────── */
  function update(dt) {
    G.t += dt;
    G.shake = Math.max(0, G.shake - dt * 3.4);

    for (const p of G.pops) { p.y -= 44 * dt; p.life -= dt; }
    G.pops = G.pops.filter(p => p.life > 0);
    for (const c of G.crumbs) { c.x += c.vx; c.y += c.vy; c.vy += 0.22; c.life -= dt; }
    G.crumbs = G.crumbs.filter(c => c.life > 0);

    ({ rain: stepRain, deck: stepDeck, shudder: stepShudder, sink: stepSink,
       boat: stepBoat, loop: stepLoop, end: fallOnly }[G.state])(dt);
  }

  function walk(dt, lo, hi) {
    let d = 0;
    if (held("d", "ArrowRight")) { d = 1; G.face = 1; }
    if (held("a", "ArrowLeft")) { d = -1; G.face = -1; }
    if (held("w", "ArrowUp") && d === 0) d = G.face;      // W walks the way you face
    if (d) { G.px = clamp(G.px + d * 200 * dt, lo, hi); G.walkT += dt * 11; }
    else G.walkT *= 0.86;
  }

  /* act one — five hundred of them */
  function stepRain(dt) {
    walk(dt, 40, 920);

    if (G.n < GOAL && G.cookies.length < 46 && Math.random() < 0.34)
      G.cookies.push(newCookie());

    for (const c of G.cookies) {
      if (c.landed) { c.spin *= 0.9; continue; }
      c.y += c.vy; c.vy += 0.13; c.spin += c.vs;
      if (c.y >= GROUND - c.r) {
        c.y = GROUND - c.r; c.landed = true; c.vy = 0;
        if (Math.random() < 0.3) SFX.land();
        crumb(c.x, GROUND, "#B98A4A", 3);
      }
    }

    G.eat -= dt;
    if (held("e") && G.eat <= 0 && G.n < GOAL) {
      G.eat = 0.085;
      const got = G.cookies.filter(c => c.landed && Math.abs(c.x - G.px) < 66);
      if (got.length) {
        G.n = Math.min(GOAL, G.n + got.length);
        SFX.chomp();
        pop(G.px, GROUND - 96, "+" + got.length);
        got.forEach(c => crumb(c.x, c.y, Math.random() < 0.5 ? "#D8A45C" : "#3E2411", 8));
        G.cookies = G.cookies.filter(c => !got.includes(c));
        if (G.n >= GOAL) {
          G.cookies = [];
          SFX.yay(); SFX.horn(); G.shake = 1.4;
          pop(W / 2, 240, "FIVE HUNDRED", "#E8B24A", 46);
        }
      }
    }

    if (G.n >= GOAL) G.ship = Math.min(1, G.ship + dt * 0.42);
  }

  /* act two — aboard, and then not */
  function stepDeck(dt) {
    walk(dt, 200, 760);
    if (G.t > 3.5) { G.state = "shudder"; G.t = 0; G.shake = 2.2; SFX.boom(); noise(1.5, 0.22, 0, 260); }
  }

  function stepShudder(dt) {
    walk(dt, 200, 760);
    if (G.t < 0.8 && Math.random() < 0.3) G.shake = Math.max(G.shake, 0.9);
    if (G.t > 2.2) { G.state = "sink"; G.t = 0; SFX.rise(); }
  }

  function stepSink(dt) {
    walk(dt, 200, 760);
    G.tilt = Math.min(0.6, G.tilt + dt * 0.08);
    G.water = Math.min(1, G.water + dt * 0.15);
    if (Math.random() < 0.06) { G.shake = Math.max(G.shake, 0.35); noise(0.4, 0.07, 0, 600); }
    if (Math.random() < 0.5)
      G.crumbs.push({ x: rnd(180, 820), y: GROUND - rnd(0, 150), vx: rnd(-2, 2),
                      vy: rnd(-3.4, -0.6), c: "#DCEAF2", life: rnd(0.4, 0.8), r: rnd(2, 4) });
    /* cut away while the deck is still above water — you got off in time */
    if (G.water >= 0.86) { G.state = "boat"; G.t = 0; SFX.row(); }
  }

  function stepBoat(dt) {
    G.boat = Math.min(1, G.boat + dt * 0.14);
    if (Math.random() < 0.02) SFX.row();
    if (G.t > 7.4) { G.state = "loop"; G.t = 0; G.loopT = 0; SFX.yay(); }
  }

  /* and then it just starts again */
  function fallOnly(dt) {
    if (G.cookies.length < 30 && Math.random() < 0.5) G.cookies.push(newCookie());
    for (const c of G.cookies) {
      if (c.landed) { c.spin *= 0.9; continue; }
      c.y += c.vy; c.vy += 0.13; c.spin += c.vs;
      if (c.y >= GROUND - c.r) { c.y = GROUND - c.r; c.landed = true; c.vy = 0; }
    }
  }

  function stepLoop(dt) {
    fallOnly(dt);
    if (G.t > 4) { G.state = "end"; G.t = 0; }
  }

  /* ── drawing ────────────────────────────────────────────── */
  const slab = s => `${s}px "Alfa Slab One", Georgia, serif`;
  const mono = (s, w = 600) => `${w} ${s}px "IBM Plex Mono", monospace`;

  function text(str, x, y, { size = 14, color = "#F2E6CE", align = "center", face = "mono", w = 600 } = {}) {
    ctx.font = face === "slab" ? slab(size) : mono(size, w);
    ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = "middle";
    ctx.fillText(str, x, y);
  }
  function circle(x, y, r, fill, stroke, lw = 2) {
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
  }
  function rect(x, y, w, h, fill) { ctx.fillStyle = fill; ctx.fillRect(x, y, w, h); }

  function draw() {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    const s = reduced ? G.shake * 3 : G.shake * 10;
    ctx.translate(rnd(-1, 1) * s, rnd(-1, 1) * s);

    const day = G.state === "rain" || G.state === "loop" || G.state === "end";
    if (day) { skyDay(); seaStrip(); if (G.ship > 0 && G.state === "rain") shipOnHorizon(); groundSand(); }
    else { skyNight(); water(); }

    if (day) {
      G.cookies.forEach(drawCookie);
      drawPerson(G.px, GROUND, 1);
    } else if (G.state === "boat") {
      drawSternAndBoat();
    } else {
      drawShipDeck();
    }

    for (const c of G.crumbs) {
      ctx.globalAlpha = clamp(c.life * 2.4, 0, 1);
      rect(c.x - c.r / 2, c.y - c.r / 2, c.r, c.r, c.c);
    }
    ctx.globalAlpha = 1;

    for (const p of G.pops) {
      ctx.globalAlpha = clamp(p.life * 1.7, 0, 1);
      text(p.text, p.x, p.y, { size: p.size, color: p.color, face: p.size > 30 ? "slab" : "mono" });
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    hud();
  }

  function skyDay() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#2C5F86"); g.addColorStop(0.45, "#79B2CE");
    g.addColorStop(0.72, "#D9C08C"); g.addColorStop(1, "#EFD7A2");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    circle(806, 92, 34, "#FFF2CE");
    ctx.globalAlpha = 0.12; circle(806, 92, 82, "#FFF2CE"); ctx.globalAlpha = 1;
    for (let i = 0; i < 7; i++) {
      const cx = ((i * 192 + G.t * 9) % (W + 300)) - 150, cy = 66 + ((i * 61) % 150);
      ctx.globalAlpha = 0.5; ctx.fillStyle = "#E9D6B2";
      [[0, 0, 42], [36, 8, 32], [-34, 9, 28]].forEach(([ox, oy, r]) => {
        ctx.beginPath(); ctx.ellipse(cx + ox, cy + oy, r, r * 0.6, 0, 0, Math.PI * 2); ctx.fill();
      });
      ctx.globalAlpha = 1;
    }
  }

  /* the sea stops short of the landing line, so cookies rest on sand
     rather than appearing to float on the water */
  const SHORE = GROUND - 44;

  function seaStrip() {
    const g = ctx.createLinearGradient(0, 320, 0, SHORE);
    g.addColorStop(0, "#2C97BE"); g.addColorStop(1, "#155B86");
    ctx.fillStyle = g; ctx.fillRect(0, 320, W, SHORE - 320);
    ctx.strokeStyle = "rgba(236,246,251,.22)"; ctx.lineWidth = 2;
    for (let r = 0; r < 4; r++) {
      const yy = 332 + r * 24;
      ctx.beginPath();
      for (let i = 0; i <= W; i += 10) {
        const yv = yy + Math.sin(i * 0.024 + G.t * 1.5 + r) * 3;
        i ? ctx.lineTo(i, yv) : ctx.moveTo(i, yv);
      }
      ctx.stroke();
    }
  }

  function groundSand() {
    const g = ctx.createLinearGradient(0, SHORE, 0, H);
    g.addColorStop(0, "#D9BC7E"); g.addColorStop(0.14, "#E3C88E"); g.addColorStop(1, "#B8975C");
    ctx.fillStyle = g; ctx.fillRect(0, SHORE, W, H - SHORE);
    /* wet sand where the water has just been */
    ctx.fillStyle = "rgba(90,120,130,.18)";
    for (let i = 0; i <= W; i += 8) {
      const d = 5 + Math.sin(i * 0.03 + G.t * 1.1) * 3;
      ctx.fillRect(i, SHORE, 8, d);
    }
    for (let i = 0; i < 60; i++) rect((i * 97) % W, GROUND + 12 + ((i * 53) % 110), 4, 3, "rgba(140,112,64,.34)");
    for (let i = 0; i < 30; i++) rect((i * 137) % W, GROUND + 4 + ((i * 71) % 28), 3, 2, "rgba(62,36,17,.26)");
  }

  function skyNight() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#050810"); g.addColorStop(0.55, "#0C1A31"); g.addColorStop(1, "#17324F");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 140; i++) {
      const sx = (i * 127) % W, sy = (i * 83) % 340;
      ctx.globalAlpha = 0.3 + Math.abs(Math.sin(G.t * 1.2 + i)) * 0.6;
      rect(sx, sy, i % 19 === 0 ? 3 : 2, i % 19 === 0 ? 3 : 2, "#FFFFFF");
    }
    ctx.globalAlpha = 1;
    circle(828, 78, 24, "#F4EEDA");
    ctx.globalAlpha = 0.1; circle(828, 78, 62, "#F4EEDA"); ctx.globalAlpha = 1;
  }

  function water() {
    const g = ctx.createLinearGradient(0, GROUND, 0, H);
    g.addColorStop(0, "#12557E"); g.addColorStop(1, "#04162E");
    ctx.fillStyle = g; ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.strokeStyle = "rgba(220,234,242,.16)"; ctx.lineWidth = 2;
    for (let r = 0; r < 6; r++) {
      const yy = GROUND + 10 + r * 26;
      ctx.beginPath();
      for (let i = 0; i <= W; i += 10) {
        const yv = yy + Math.sin(i * 0.022 + G.t * 1.3 + r) * (3 + r);
        i ? ctx.lineTo(i, yv) : ctx.moveTo(i, yv);
      }
      ctx.stroke();
    }
  }

  function drawCookie(c) {
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.spin);
    if (c.landed) {
      ctx.fillStyle = "rgba(0,0,0,.18)";
      ctx.beginPath(); ctx.ellipse(0, c.r * 0.9, c.r, c.r * 0.3, 0, 0, Math.PI * 2); ctx.fill();
    }
    circle(0, 0, c.r, "#D8A45C");
    circle(0, 0, c.r * 0.82, "#C08C46");
    ctx.fillStyle = "#3E2411";
    c.chips.forEach(([ox, oy, r]) => { ctx.beginPath(); ctx.arc(ox * c.r, oy * c.r, r, 0, Math.PI * 2); ctx.fill(); });
    ctx.restore();
  }

  function drawPerson(px, py, scale) {
    ctx.save(); ctx.translate(px, py); ctx.scale(scale * G.face, scale);
    const bob = Math.sin(G.walkT) * 2.5, legs = Math.sin(G.walkT) * 9;
    ctx.fillStyle = "rgba(0,0,0,.22)";
    ctx.beginPath(); ctx.ellipse(0, 2, 20, 6, 0, 0, Math.PI * 2); ctx.fill();
    rect(-9, -26 + bob, 7, 26, "#2E3A5C");          // legs
    rect(3, -26 + bob, 7, 26, "#2E3A5C");
    ctx.save(); ctx.translate(0, -26 + bob);
    rect(-9, legs * 0.1, 7, 4, "#241A12");
    ctx.restore();
    rect(-14, -58 + bob, 28, 34, "#4FA86E");        // body
    rect(-14, -58 + bob, 28, 6, "#3C8455");
    rect(11, -52 + bob, 8, 20, "#F0C89A");          // arm
    rect(-11, -80 + bob, 22, 24, "#F0C89A");        // head
    rect(-11, -84 + bob, 22, 8, "#3E2411");         // hair
    rect(-5, -74 + bob, 4, 4, "#241A12");           // eye
    rect(4, -74 + bob, 4, 4, "#241A12");
    ctx.restore();
  }

  /* the ship, three ways: horizon, deck, and stern */
  function hull(w, h) {
    ctx.beginPath();
    ctx.moveTo(-w, -h); ctx.lineTo(w, -h);
    ctx.quadraticCurveTo(w * 1.11, -h * 0.05, w * 0.89, h);
    ctx.lineTo(-w * 0.87, h);
    ctx.quadraticCurveTo(-w * 1.08, -h * 0.05, -w, -h);
    ctx.closePath();
  }

  function shipOnHorizon() {
    const k = G.ship, sx = lerp(1260, 600, k), sy = 356, s = 0.32 + k * 0.12;
    ctx.save(); ctx.translate(sx, sy); ctx.scale(s, s);
    ctx.fillStyle = "#0C1218"; hull(300, 30); ctx.fill();
    rect(-286, 14, 548, 16, "#8C1F14");
    rect(-186, -64, 372, 34, "#F2E6CE");
    for (let i = 0; i < 20; i++) rect(-178 + i * 18, -56, 8, 10, "#FFD25A");
    for (let i = 0; i < 4; i++) {
      const fx = -118 + i * 78;
      rect(fx - 15, -128, 30, 64, "#E8B24A");
      rect(fx - 15, -128, 30, 15, "#14181E");
    }
    ctx.restore();
    for (let i = 0; i < 4; i++)
      if (Math.random() < 0.4)
        G.crumbs.push({ x: sx + (-118 + i * 78) * s, y: sy - 132 * s, vx: rnd(-0.6, 0.6),
                        vy: rnd(-1.4, -0.4), c: "#8C949C", life: rnd(0.6, 1.2), r: rnd(3, 6) });
    if (k >= 1) {
      const pulse = 0.65 + 0.35 * Math.sin(G.t * 6);
      ctx.globalAlpha = pulse;
      text("PRESS  B  TO GO ON IT", W / 2, 268, { size: 30, color: "#FFE45A", face: "slab" });
      ctx.globalAlpha = 1;
    }
  }

  function drawShipDeck() {
    const cx = 480, cy = GROUND - 14 + G.water * 250;
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(-G.tilt);
    ctx.fillStyle = "#0C1218"; hull(300, 34); ctx.fill();
    rect(-288, 12, 552, 20, "#8C1F14");
    rect(-192, -72, 384, 38, "#F2E6CE");
    const lit = G.water < 0.62;
    for (let i = 0; i < 21; i++) rect(-184 + i * 18, -64, 8, 11, lit ? "#FFD25A" : "#3A3226");
    for (let i = 0; i < 4; i++) {
      const fx = -120 + i * 80;
      rect(fx - 16, -140, 32, 68, "#E8B24A");
      rect(fx - 16, -140, 32, 16, "#14181E");
      if (G.state === "deck" && Math.random() < 0.35)
        G.crumbs.push({ x: cx + fx, y: cy - 146, vx: rnd(-0.9, 0.9), vy: rnd(-1.9, -0.6),
                        c: "#5A6068", life: rnd(0.6, 1.3), r: rnd(4, 8) });
    }
    ctx.save(); ctx.translate(clamp(G.px, 200, 760) - cx, -72); drawPerson(0, 0, 0.74); ctx.restore();
    ctx.restore();
  }

  function drawSternAndBoat() {
    const k = G.boat;
    /* the stern, standing on end, sliding under as you row off */
    ctx.save();
    ctx.translate(lerp(600, 850, k), GROUND + 40 + k * 46);
    ctx.rotate(-1.2);
    ctx.globalAlpha = clamp(1.3 - k, 0, 1);
    ctx.fillStyle = "#0C1218";
    ctx.beginPath();
    ctx.moveTo(-44, 30); ctx.lineTo(-40, -150);
    ctx.quadraticCurveTo(0, -196, 40, -150);
    ctx.lineTo(44, 30); ctx.closePath(); ctx.fill();
    rect(-44, -26, 88, 56, "#8C1F14");                 // red below the waterline
    ctx.strokeStyle = "#3A444E"; ctx.lineWidth = 3;    // stern rail
    ctx.beginPath(); ctx.moveTo(-34, -158); ctx.lineTo(34, -158); ctx.stroke();
    ctx.fillStyle = "#5A3E1E";                          // the last few lights
    [[-20, -120], [4, -132], [22, -104]].forEach(([ox, oy]) => {
      ctx.beginPath(); ctx.arc(ox, oy, 4, 0, Math.PI * 2); ctx.fill();
    });
    /* the propellers, out of the water where they should never be */
    ctx.fillStyle = "#2A323A";
    [[-18, -6], [18, -6]].forEach(([ox, oy]) => {
      for (let i = 0; i < 3; i++) {
        ctx.save(); ctx.translate(ox, oy); ctx.rotate(i * 2.094);
        ctx.beginPath(); ctx.ellipse(0, -9, 4, 9, 0, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
    });
    ctx.globalAlpha = 1; ctx.restore();

    const bx = lerp(470, 250, k), by = GROUND + 26, rock = Math.sin(G.t * 3) * 2.6;
    ctx.save(); ctx.translate(bx, by + rock); ctx.rotate(rock * 0.012);
    ctx.fillStyle = "#F2E6CE";
    ctx.beginPath();
    ctx.moveTo(-92, -26); ctx.quadraticCurveTo(-104, 4, -70, 20);
    ctx.lineTo(70, 20); ctx.quadraticCurveTo(104, 4, 92, -26);
    ctx.closePath(); ctx.fill();
    rect(-88, -26, 176, 8, "#DCD0B4");
    rect(-70, -18, 140, 10, "#0E2A3A");
    ctx.strokeStyle = "#C9A96B"; ctx.lineWidth = 5; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-60, -14); ctx.lineTo(-124, 16 + Math.sin(G.t * 3.6) * 6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(60, -14); ctx.lineTo(124, 16 + Math.sin(G.t * 3.6 + 1) * 6); ctx.stroke();
    ctx.lineCap = "butt";
    ctx.save(); ctx.translate(-24, -22); drawPerson(0, 0, 0.42); ctx.restore();
    [[18, "#6B2A3A"], [50, "#2E3A5C"]].forEach(([x2, col]) => {
      rect(x2 - 8, -34, 16, 20, col);
      rect(x2 - 6, -48, 12, 14, "#F0C89A");
      rect(x2 - 8, -51, 16, 5, "#2A2028");
    });
    ctx.restore();
  }

  /* ── the counter, the captions, the end ─────────────────── */
  function hud() {
    if (G.state === "rain") {
      ctx.fillStyle = "rgba(26,20,16,.72)";
      ctx.beginPath(); ctx.roundRect(W / 2 - 148, 22, 296, 66, 6); ctx.fill();
      ctx.strokeStyle = "rgba(232,178,74,.5)"; ctx.lineWidth = 2; ctx.stroke();
      text(comma(G.n) + "  /  " + comma(GOAL), W / 2, 52, { size: 34, color: "#E8B24A", face: "slab" });
      text("COOKIES EATEN", W / 2, 76, { size: 10, color: "#8A7458" });

      if (G.n < GOAL) {
        const near = G.cookies.some(c => c.landed && Math.abs(c.x - G.px) < 66);
        text(near ? "HOLD  E" : "walk to a cookie", G.px, GROUND - 118,
             { size: 13, color: near ? "#FFE45A" : "rgba(242,230,206,.55)" });
      }
    }

    const caption = {
      deck:    "YOU ARE ABOARD. IT IS VERY CALM.",
      shudder: "YOU FEEL THE SHUDDER",
      sink:    "IT IS GOING DOWN",
      boat:    G.t > 4 ? "AND THEN IT JUST STARTS AGAIN" : "YOU ARE IN THE LIFEBOAT",
      loop:    "…"
    }[G.state];

    /* captions ride at the top — the ship owns the bottom of the frame */
    if (caption) {
      ctx.font = slab(26);
      const w = ctx.measureText(caption).width + 44;
      ctx.fillStyle = "rgba(10,14,22,.8)";
      ctx.beginPath(); ctx.roundRect(W / 2 - w / 2, 30, w, 52, 6); ctx.fill();
      ctx.strokeStyle = "rgba(232,178,74,.45)"; ctx.lineWidth = 2; ctx.stroke();
      text(caption, W / 2, 57, { size: 26, color: "#FFE45A", face: "slab" });
    }

    if (G.state === "end") {
      ctx.fillStyle = "rgba(10,8,6,.72)"; ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = clamp(G.t * 1.4, 0, 1);
      text("THE END", W / 2, H / 2 - 18, { size: 76, color: "#E8B24A", face: "slab" });
      text("five hundred cookies, one ship, one lifeboat", W / 2, H / 2 + 42,
           { size: 15, color: "#F2E6CE", w: 400 });
      text("press R to eat them all again", W / 2, H - 60, { size: 13, color: "#8A7458", w: 400 });
      ctx.globalAlpha = 1;
    }
  }

  /* ── loop ───────────────────────────────────────────────── */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    update(dt); draw();
    requestAnimationFrame(frame);
  }

  reset();

  /* ?act=deck | sink | boat | end  — jump straight to a part of it */
  const act = new URLSearchParams(location.search).get("act");
  if (act && act !== "rain") {
    G.n = GOAL; G.cookies = []; G.ship = 1;
    if (act === "deck") { G.state = "deck"; G.px = 470; }
    if (act === "sink") { G.state = "sink"; G.px = 470; G.tilt = 0.2; G.water = 0.3; }
    if (act === "boat") { G.state = "boat"; G.boat = 0.15; }
    if (act === "end")  { G.state = "end"; }
  }

  const start = () => { last = performance.now(); requestAnimationFrame(frame); };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(start); else start();
})();
</script>
